[project]
name = "chaos-agents"
version = "0.1.0"
description = "AI Red Team Framework - Chaos Monkey for AI Agent Systems. Prompt injection, memory poisoning, infra stress testing, and more."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Ansumanbhujabal", email = "ansumanbhujabal1@gmail.com" },
]

dependencies = [
    "agentscope>=1.0.0",
    "openai>=1.0.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "click>=8.0.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
rag = [
    "qdrant-client>=1.7.0",
]
memory = [
    "redis>=5.0.0",
    "mem0ai>=0.1.0",
]
tracing = [
    "opentelemetry-api>=1.20.0",
    "opentelemetry-sdk>=1.20.0",
    "opentelemetry-exporter-otlp>=1.20.0",
]
eval = [
    "ray>=2.9.0",
]
all = [
    "chaos-agents[rag,memory,tracing,eval]",
]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[project.scripts]
chaos-agents = "chaos_agents.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chaos_agents"]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.mypy]
python_version = "3.10"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
